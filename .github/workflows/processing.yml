name: Processing acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  processing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --no-sync ruff check src scripts tests --select E9,F821,F822,F823
      - run: uv run --no-sync python scripts/validate_processing.py
      - run: uv build --no-sources
